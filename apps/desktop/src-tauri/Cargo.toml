[package]
name = "codingagent"
version = "0.1.0"
description = "CodingAgent desktop and mobile shell"
authors = ["CodingAgent"]
edition = "2021"
rust-version = "1.77.2"

# The lib target is required by `tauri mobile` (Android/iOS entry point).
[lib]
name = "codingagent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# `custom-protocol` is enabled automatically by `tauri build`.
default = []
custom-protocol = ["tauri/custom-protocol"]
